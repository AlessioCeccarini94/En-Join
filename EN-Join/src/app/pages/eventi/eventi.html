<h3 class="hero-title">Prossimi Eventi</h3>
<div class="container mt-4">
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
    @for (event of upcomingEvents; track event.id) {
      <div class="col">
        <div class="hero-card">
          <div class="hero-card-body flex-column">
            <div class="hero-card-text h-100">
              <h5 class="hero-card-title">{{ event.category }}</h5>
              <h4>{{ event.description }}</h4>
              <p><strong>Luogo:</strong> {{ event.location }}</p>
              <p><strong>Data:</strong> {{ event.date }}</p>
              <p><strong>Max Persone:</strong> {{ event.numberOfPeople }}</p>
            </div>
            <div>
              <button type="button" class="btn btn-primary" (click)="joinEvent(event)">
                Partecipa
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
