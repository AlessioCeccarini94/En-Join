<h2 class="text-center mt-3">Profilo</h2>

<div class="container mt-4">
  <div class="row w-100 h-100">
    <div class="profile-info-container">
      <mat-list class="profile-info-list">
        <div class="user-info d-flex">
          <mat-list-item><p class="profile-info-title">Immagine del profilo</p></mat-list-item>
          <mat-list-item><img src="{{ user()?.image }}" alt="" /></mat-list-item>
        </div>
        <div class="user-info d-flex">
          <mat-list-item><p class="profile-info-title">Nome e Cognome</p></mat-list-item>
          <mat-list-item
            ><p class="profile-info">
              {{ user()?.firstName }} {{ user()?.lastName }}
            </p></mat-list-item
          >
        </div>
        <div class="user-info d-flex">
          <mat-list-item><p class="profile-info-title">Cellulare</p></mat-list-item>
          <mat-list-item
            ><p class="profile-info">{{ user()?.phone }}</p></mat-list-item
          >
        </div>
        <div class="user-info d-flex">
          <mat-list-item><p class="profile-info-title">Email</p></mat-list-item>
          <mat-list-item
            ><p class="profile-info">{{ user()?.email }}</p></mat-list-item
          >
        </div>
        <div class="user-info d-flex">
          <mat-list-item><p class="profile-info-title">Città</p></mat-list-item>
          <mat-list-item
            ><p class="profile-info">{{ user()?.location }}</p></mat-list-item
          >
        </div>
      </mat-list>
    </div>
  </div>
</div>
<h2 class="text-center mt-3">I miei eventi</h2>

<div class="container mt-4">
  <div class="row row-cols-3">
    <div class="col">
      <div class="hero-card">
        <div>
          <img
            src="https://www.placecats.com/50/50"
            class="card-img-top"
            alt="https://www.placecats.com/50/50"
          />
        </div>
        <div class="hero-card-body">
          <div class="hero-card-text">
            <h5 class="hero-card-title">Card title</h5>
            <p>TEXT CARD</p>
          </div>
          <a href="#" class="btn btn-primary">Go</a>
        </div>
      </div>
    </div>
  </div>
</div>
